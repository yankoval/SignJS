<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SignJS Cloud — Автоматизация Yandex Cloud</title>
    <link rel="stylesheet" href="style.css?v=1.3.0">
</head>
<body>

<button id="productionWidget" class="production-widget" type="button" aria-expanded="false" aria-controls="fullInterface" title="Мониторинг выключен">
    <svg class="production-widget-icon" viewBox="0 0 100 100" width="56" height="56" fill="none" stroke="#252923" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path class="production-widget-paper" d="M11 65Q37 70 78 62L83 86Q47 81 16 90L9 85Z"></path>
        <path class="production-widget-copy" d="m13 86 4 1q32-8 63-3M19 89q30-7 58-3"></path>
        <path class="production-widget-signature" pathLength="100" d="M39 79q10-10 7-2t11-2q-2 7 9 0"></path>
        <g class="production-widget-inkwell">
            <path d="m75 53-1 16c0 6 20 6 20 0l-1-16"></path>
            <ellipse cx="84" cy="53" rx="9" ry="3"></ellipse>
            <path d="M75 59q9 4 18 0m-18 5q9 4 18 0m-17 5q8 3 16 0"></path>
        </g>
        <g class="production-widget-quill">
            <path class="production-widget-feather" d="M23 7C23 27 26 40 45 54l9 23-5-29C49 34 37 17 23 7Z"></path>
            <path d="M25 11q19 32 29 66m-3-9 3 9-4-3"></path>
            <path class="production-widget-hatching" d="m25 16 9 11m-8-5 11 11m-10-5 13 11m-12-4 15 11m-11-4 12 9m-11-27 1 6m3-2 1 8m3-3 1 9m3-2 1 8"></path>
        </g>
        <path class="production-widget-hand" d="m12 52 13 5q-1-12 5-13 5-2 10 5l10 4q8 5 8 10l-3 6q-1 8-9 8l-16-7-14-4Z"></path>
        <path d="M29 47q-2 5 4 9l12 7q8 4 10 0M27 55q-2 6 5 9l13 6q7 3 9-1M28 64q0 4 6 7l12 5M39 51q-4 0-3 4l11 6q4 3 6 0m-5-6q-4-1-3 3l5 3"></path>
        <path class="production-widget-hatching" d="m14 55 4 9m-1-8 4 9m10 1 1 4m4-2 1 5m4-3 1 4"></path>
    </svg>
    <span id="productionStatusText" class="visually-hidden">Мониторинг выключен</span>
</button>

<main id="fullInterface">
<div class="production-mode-toolbar">
    <button id="compactModeBtn" class="btn-secondary compact-mode-button" type="button" aria-label="Свернуть в промышленный режим">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"></path></svg>
        <span>Свернуть</span>
    </button>
</div>
<div class="container">
    <h2>1. Настройки API Yandex Cloud</h2>
    <div class="field-group">
        <label for="apiUrl">API Gateway URL:</label>
        <input type="text" id="apiUrl" placeholder="https://functions.yandexcloud.net/...">
    </div>
    <div class="field-group">
        <label for="apiKey">X-Api-Key:</label>
        <input type="password" id="apiKey" placeholder="Ваш API Key">
    </div>
    <button onclick="saveApiSettings()" class="btn-secondary">Сохранить настройки API</button>
</div>

<div class="container">
    <h2>2. Настройки соответствия ИНН</h2>
    <div class="settings-actions">
        <button onclick="exportSettings()" class="btn-secondary">Экспорт JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importSettings(this)">
        <button onclick="document.getElementById('importFile').click()" class="btn-secondary">Импорт JSON</button>
    </div>

    <table id="innTable">
        <thead>
            <tr>
                <th>ИНН</th>
                <th>Сертификат (Thumbprint)</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="innTableBody"></tbody>
    </table>
</div>

<div id="wizardContainer" class="container wizard-section" style="display:none;">
    <h2 style="color: #f4b400;">🪄 Мастер настройки ИНН</h2>
    <p>Обнаружены объекты с новыми ИНН. Выберите сертификат для каждого:</p>
    <div id="wizardList"></div>
</div>

<div class="container auto-section">
    <h2>3. Мониторинг очереди YMQ</h2>
    <div class="actions">
        <button id="startAutoBtn" class="btn-primary" style="background: #f4b400;">ВКЛЮЧИТЬ МОНИТОРИНГ</button>
        <button id="stopAutoBtn" class="btn-secondary" disabled>ОСТАНОВИТЬ</button>
    </div>
    <div id="autoStatus" class="status">Авто-режим выключен</div>
    <ul id="processedFiles" class="log-list"></ul>
</div>

<select id="certList" style="display:none"></select>
</main>

<script src="cadesplugin_api.js"></script>
<script src="CloudSignApp.js?v=1.3.0"></script>
</body>
</html>

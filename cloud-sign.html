<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SignJS Cloud — Автоматизация Yandex Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="productionWidget" class="production-widget" type="button" aria-expanded="false" aria-controls="fullInterface" title="Мониторинг выключен">
    <span class="production-widget-ring" aria-hidden="true"></span>
    <svg class="production-widget-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 2.75h7l4 4V20a1.25 1.25 0 0 1-1.25 1.25h-9.5A1.25 1.25 0 0 1 6 20V4A1.25 1.25 0 0 1 7.25 2.75Z"></path>
        <path d="M14 2.75V7h4"></path>
        <path class="production-widget-signature" d="m8.5 15 2.1 2.1 4.9-5"></path>
    </svg>
    <span id="productionStatusText" class="visually-hidden">Мониторинг выключен</span>
</button>

<main id="fullInterface">
<div class="container">
    <h2>1. Настройки API Yandex Cloud</h2>
    <div class="field-group">
        <label for="apiUrl">API Gateway URL:</label>
        <input type="text" id="apiUrl" placeholder="https://functions.yandexcloud.net/...">
    </div>
    <div class="field-group">
        <label for="apiKey">X-Api-Key:</label>
        <input type="password" id="apiKey" placeholder="Ваш API Key">
    </div>
    <button onclick="saveApiSettings()" class="btn-secondary">Сохранить настройки API</button>
</div>

<div class="container">
    <h2>2. Настройки соответствия ИНН</h2>
    <div class="settings-actions">
        <button onclick="exportSettings()" class="btn-secondary">Экспорт JSON</button>
        <input type="file" id="importFile" style="display:none" onchange="importSettings(this)">
        <button onclick="document.getElementById('importFile').click()" class="btn-secondary">Импорт JSON</button>
    </div>

    <table id="innTable">
        <thead>
            <tr>
                <th>ИНН</th>
                <th>Сертификат (Thumbprint)</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="innTableBody"></tbody>
    </table>
</div>

<div id="wizardContainer" class="container wizard-section" style="display:none;">
    <h2 style="color: #f4b400;">🪄 Мастер настройки ИНН</h2>
    <p>Обнаружены объекты с новыми ИНН. Выберите сертификат для каждого:</p>
    <div id="wizardList"></div>
</div>

<div class="container auto-section">
    <h2>3. Мониторинг очереди YMQ</h2>
    <div class="actions">
        <button id="startAutoBtn" class="btn-primary" style="background: #f4b400;">ВКЛЮЧИТЬ МОНИТОРИНГ</button>
        <button id="stopAutoBtn" class="btn-secondary" disabled>ОСТАНОВИТЬ</button>
    </div>
    <div id="autoStatus" class="status">Авто-режим выключен</div>
    <button id="compactModeBtn" class="btn-secondary compact-mode-button" type="button">СВЕРНУТЬ В ПРОМЫШЛЕННЫЙ РЕЖИМ</button>
    <ul id="processedFiles" class="log-list"></ul>
</div>

<select id="certList" style="display:none"></select>
</main>

<script src="cadesplugin_api.js"></script>
<script src="CloudSignApp.js?v=1.2.0"></script>
</body>
</html>
